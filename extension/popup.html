<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AO3 Exact Title Search</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div>
      <h1>Exact title search</h1>
      <p id="status">Enabled</p>
    </div>
    <label class="switch">
      <input id="enabled" type="checkbox" aria-describedby="status">
      <span class="track" aria-hidden="true"><span class="thumb"></span></span>
      <span class="sr-only">Enable exact title search</span>
    </label>
  </main>
  <script src="popup.js"></script>
</body>
</html>
