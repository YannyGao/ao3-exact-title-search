<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 800px; margin: 0; overflow: hidden; }
    body { background: #f7f7f7; color: #2a2a2a; font: 20px/1.45 Arial, Helvetica, sans-serif; }
    header { height: 132px; padding: 0 58px; display: flex; align-items: center; gap: 55px; color: white; background: linear-gradient(#a50606, #780000); border-bottom: 4px solid #333; }
    nav { display: flex; gap: 44px; font-size: 26px; font-weight: 700; }
    .search { margin-left: auto; display: flex; gap: 16px; }
    .search span { display: block; width: 360px; height: 50px; border-radius: 25px; background: #f5f5f5; box-shadow: inset 0 2px 5px #999; }
    .search b { padding: 8px 22px; border-radius: 5px; background: #eee; color: #444; box-shadow: 0 2px 4px #333; }
    main { width: 100%; height: 668px; padding: 74px 82px; background: #fff; }
    .label { color: #900; font-size: 15px; font-weight: 800; letter-spacing: .18em; }
    h1 { max-width: 850px; margin: 16px 0 25px; font: 72px/1 Georgia, serif; }
    p { max-width: 760px; margin: 0; color: #555; font-size: 25px; }
    .rule { display: flex; gap: 18px; margin-top: 55px; padding-top: 30px; border-top: 1px solid #ccc; color: #333; font-size: 18px; }
    .rule strong { color: #900; }
  </style>
</head>
<body>
  <header>
    <nav><span>Fandoms</span><span>Browse</span><span>Search</span><span>About</span></nav>
    <div class="search"><span></span><b>Search</b></div>
  </header>
  <main>
    <div class="label">AO3 EXACT TITLE SEARCH</div>
    <h1>The native search box,<br>with exact title wording.</h1>
    <p>The extension keeps the AO3 interface unchanged and applies contiguous title matching in the background.</p>
    <div class="rule"><strong>Single purpose</strong><span>Exact title wording · Original order · No added interface</span></div>
  </main>
</body>
</html>
